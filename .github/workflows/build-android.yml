name: Build VOXELION Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore
        run: dotnet restore Voxelion.Android/Voxelion.Android.csproj

      - name: Publish APK
        run: |
          dotnet publish Voxelion.Android/Voxelion.Android.csproj \
            -c Release \
            -f net8.0-android34.0 \
            -o ./output \
            /p:ApplicationId=com.voxelion.app \
            /p:ApplicationTitle=VOXELION

      - name: List output
        run: find output -type f | head -40

      - name: Verify APK
        run: |
          APK=$(find output -name "*.apk" | head -1)
          echo "APK=$APK"
          test -n "$APK" || (echo "No APK" && exit 1)
          unzip -l "$APK" | head -30
          echo "OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxelion-android-apk
          path: output/**/*.apk
