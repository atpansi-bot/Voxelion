name: Build VOXELION Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: |
          dotnet --list-sdks
          dotnet workload install android --skip-manifest-update

      - name: Restore
        run: |
          dotnet restore Voxelion.Android/Voxelion.Android.csproj \
            -p:CheckEolTargetFramework=false \
            -p:CheckEolWorkloads=false

      - name: Publish APK
        run: |
          dotnet publish Voxelion.Android/Voxelion.Android.csproj \
            -c Release \
            -f net8.0-android34.0 \
            -r android-arm64 \
            -o ./output \
            -p:CheckEolTargetFramework=false \
            -p:CheckEolWorkloads=false \
            -p:ApplicationId=com.voxelion.app \
            -p:ApplicationTitle=VOXELION \
            -p:EmbedAssembliesIntoApk=true

      - name: List output
        run: find output -type f -name "*.apk" || true

      - name: Verify APK
        run: |
          set -e
          APK=$(find output -name "*-Signed.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find output -name "*.apk" | head -1)
          fi
          echo "APK=$APK"
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          unzip -l "$APK" | head -20
          echo "OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxelion-android-apk
          path: output/**/*-Signed.apk
          if-no-files-found: error
