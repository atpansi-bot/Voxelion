name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK (NET 8)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload & MonoGame Tool
      run: |
        dotnet workload install android
        dotnet tool install --global dotnet-mgcb

    - name: Add .NET Tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Restore Project Dependencies
      run: dotnet restore

    - name: Build Android APK
      run: |
        if [ -d "src/Voxelion.Android" ]; then
          dotnet publish src/Voxelion.Android/*.csproj -f net8.0-android -c Release -o ./output
        else
          dotnet publish src/Voxelion.Game/*.csproj -f net8.0-android -c Release -o ./output
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Voxelion-APK
        path: ./output/*.apk
