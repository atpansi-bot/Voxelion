name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK (NET 8)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload & MonoGame Tool
      run: |
        dotnet workload install android
        dotnet tool install --global dotnet-mgcb || true

    - name: Add .NET Tools to PATH
      run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Ensure Android Project Exists
      run: |
        if [ ! -f "src/Voxelion.Android/Voxelion.Android.csproj" ]; then
          mkdir -p src/Voxelion.Android
          dotnet new android -o src/Voxelion.Android --force
          dotnet add src/Voxelion.Android/Voxelion.Android.csproj reference src/Voxelion.Game/Voxelion.Game.csproj || true
        fi

    - name: Restore Project Dependencies
      run: dotnet restore VOXELION.sln /p:CheckEolTargetFramework=false

    - name: Build Android APK
      run: |
        dotnet publish src/Voxelion.Android/Voxelion.Android.csproj -c Release -o ./output /p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Voxelion-APK
        path: ./output/*.apk
